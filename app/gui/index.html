<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CloudNotes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <header class="d-flex align-items-center mb-4">
      <h1 class="h3 mb-0">CloudNotes</h1>
      <span class="badge bg-success ms-3" id="statusBadge">Loading...</span>
    </header>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="h5">New note</h2>
        <form id="noteForm" class="row g-3 mt-1">
          <div class="col-12">
            <label class="form-label">Title</label>
            <input class="form-control" name="title" required maxlength="200" />
          </div>
          <div class="col-12">
            <label class="form-label">Body</label>
            <textarea class="form-control" name="body" rows="3" required></textarea>
          </div>
          <div class="col-12">
            <button class="btn btn-primary" type="submit">Add note</button>
          </div>
        </form>
      </div>
    </div>

    <div id="notesGrid" class="row g-3"></div>
    <p id="emptyState" class="text-muted">No notes yet.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="/static/main.js"></script>
</body>
</html>
